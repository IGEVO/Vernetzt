# Grafana dashboard provider for the Vernetzt dashboards.
# Mount this file to /otel-lgtm/grafana/conf/provisioning/dashboards/vernetzt.yaml (grafana/otel-lgtm)
# and the folder observability/grafana/dashboards to /var/lib/vernetzt-dashboards.
apiVersion: 1

providers:
  - name: "Vernetzt"
    folder: "Vernetzt"
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/vernetzt-dashboards
      foldersFromFilesStructure: false
